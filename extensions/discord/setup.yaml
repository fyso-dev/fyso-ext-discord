title: {es: Conectar Discord, en: Connect Discord}
description:
  es: >-
    En el Portal de Desarrolladores de Discord, creá una aplicación. En la sección Bot,
    copiá el token (Reset Token) y activá «Message Content Intent». Pegá el token acá.
    Después abrí la página Discord del panel para invitar el bot y elegir los canales.
  en: >-
    In the Discord Developer Portal, create an application. In the Bot section, copy the
    token (Reset Token) and turn on “Message Content Intent”. Paste the token here.
    Then open the panel's Discord page to invite the bot and choose the channels.
